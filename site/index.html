<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'">
<title>Glyph Arcade</title>
<!--__META__-->
<style>
:root{font-family:Georgia,"Times New Roman",serif;color:#e8dcc0;background:#08080a}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#2a2416,#08080a 60%)}
main{max-width:980px;margin:0 auto;padding:48px 16px 64px}
header h1{font:bold clamp(40px,8vw,72px) "Courier New",monospace;letter-spacing:.28em;color:#d8b25a;margin:0;text-shadow:0 0 22px #d8b25a44}
header p{color:#b8ab8c;max-width:620px;line-height:1.6;font-size:17px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:32px}
.game{display:block;text-decoration:none;color:inherit;background:#14120ee6;border:1px solid #5d5240;overflow:hidden;transition:transform .15s,border-color .15s}
.game:hover,.game:focus-visible{transform:translateY(-3px);border-color:#d8b25a;outline:none}
.game img,.game .placeholder{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#050506}
.game .placeholder{display:grid;place-content:center;font:bold 72px "Courier New",monospace;color:#d8b25a}
.game h2{margin:14px 16px 4px;font-weight:normal;color:#d8b25a}
.game p{margin:0 16px;color:#cfc3a5;line-height:1.5;font-size:14px}
.game span{display:inline-block;margin:12px 16px 16px;font:12px "Courier New",monospace;letter-spacing:.1em;color:#9c8f72;text-transform:uppercase}
footer{margin-top:40px;color:#7d7158;font-size:13px}
footer a{color:#d8b25a}
</style>
</head>
<body>
<main>
<header><h1>GLYPH ARCADE</h1><p>Small browser games drawn entirely in coloured letters. Each game is one HTML file with no installs and no network, built on a shared letter-rendering engine.</p></header>
<section class="games" aria-label="Games">
<!--__GAMES__-->
</section>
<footer>By Taan1el · MIT licensed · <a href="https://github.com/Taan1el/glyph-arcade">Source on GitHub</a></footer>
</main>
</body>
</html>
