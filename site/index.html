<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'">
<meta name="theme-color" content="#d8b25a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Glyph Arcade</title>
<!--__META__-->
<style>
:root{font-family:Georgia,"Times New Roman",serif;color:#e8dcc0;background:#08080a}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% -20%,#2a2416,#08080a 60%)}
.skip-link{position:absolute;left:16px;top:-48px;background:#d8b25a;color:#14120e;padding:8px 14px;font:bold 13px "Courier New",monospace;text-decoration:none;z-index:10;border-radius:2px}
.skip-link:focus-visible{top:12px;outline:2px solid #fff;outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:48px 16px 64px}
header h1{font:bold clamp(26px,7.5vw,72px) "Courier New",monospace;letter-spacing:.22em;color:#d8b25a;margin:0;text-shadow:0 0 22px #d8b25a44;overflow-wrap:anywhere}
header p{color:#cfc3a5;max-width:640px;line-height:1.6;font-size:17px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:18px;margin-top:32px}
.game{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#14120ee6;border:1px solid #6b5e49;border-radius:2px;overflow:hidden;transition:transform .15s,border-color .15s}
.game:hover{transform:translateY(-3px);border-color:#d8b25a}
.game:focus-visible{transform:translateY(-3px);border-color:#d8b25a;outline:2px solid #d8b25a;outline-offset:3px}
.game img,.game .placeholder{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#050506}
.game .placeholder{display:grid;place-content:center;font:bold 72px "Courier New",monospace;color:#d8b25a}
.game h2{margin:14px 16px 6px;font-weight:normal;font-size:24px;color:#d8b25a}
.game p{margin:0 16px;color:#d8ccb0;line-height:1.5;font-size:15px;flex:1}
.game.external{border-style:dashed;background:#100f0ce6}
.game.external em{align-self:flex-start;margin:0;padding:4px 10px;background:#d8b25a;color:#14120e;font:bold 11px "Courier New",monospace;letter-spacing:.1em;text-transform:uppercase}
.game span{display:inline-block;margin:14px 16px 16px;font:bold 12px "Courier New",monospace;letter-spacing:.12em;color:#d8b25a;text-transform:uppercase}
footer{margin-top:44px;color:#a89a7c;font-size:14px;line-height:1.6}
footer a{color:#d8b25a;text-underline-offset:3px}
footer a:focus-visible{outline:2px solid #d8b25a;outline-offset:2px}
@media(max-width:420px){main{padding:32px 12px 48px}header h1{letter-spacing:.14em}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;transform:none!important}}
</style>
</head>
<body>
<a class="skip-link" href="#games">Skip to games</a>
<main>
<header><h1>GLYPH ARCADE</h1><p>Small browser games drawn entirely in coloured letters. Each game is one HTML file with no installs and no network, built on a shared letter-rendering engine.</p></header>
<section id="games" class="games" aria-label="Games">
<!--__GAMES__-->
</section>
<footer>By Taan1el · MIT licensed · Works offline · <a href="https://github.com/Taan1el/glyph-arcade">Source on GitHub</a></footer>
</main>
<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.protocol==='http:')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
</body>
</html>
